<div id="modalGaleria" class="modal">
    <div class="modal-content">
        <button class="modal-close" onclick="fecharModalGaleria()">&times;</button>
        <div id="modal-body-galeria">
            <!-- Conteúdo da galeria será carregado aqui -->
        </div>
    </div>
</div>

<script>
function abrirModalGaleria(titulo, origin, descricao, imagem) {
    const modal = document.getElementById('modalGaleria');
    const modalBody = document.getElementById('modal-body-galeria');
    
    modalBody.innerHTML = `
        <img src="${imagem}" alt="${titulo}" style="width: 100%; max-height: 400px; object-fit: cover; border-radius: 10px; margin-bottom: 20px;">
        <h2 style="color: #00ffff; text-shadow: 0 0 10px #00ffff, 0 0 20px #7d3cff; margin-bottom: 15px; font-size: 2rem;">${titulo}</h2>
        <p style="color: #00ffff; font-weight: bold; margin-bottom: 15px; font-size: 1rem;">📍 ${origin}</p>
        <p style="color: #e0e0e0; line-height: 1.8; font-size: 1.05rem; text-align: justify;">${descricao}</p>
    `;
    
    modal.style.display = 'flex';
    document.body.style.overflow = 'hidden';
}

function fecharModalGaleria() {
    const modal = document.getElementById('modalGaleria');
    modal.style.display = 'none';
    document.body.style.overflow = 'auto';
}

window.onclick = function(event) {
    const modal = document.getElementById('modalGaleria');
    if (event.target == modal) {
        fecharModalGaleria();
    }
}

document.addEventListener('keydown', function(event) {
    if (event.key === 'Escape') {
        fecharModalGaleria();
    }
});

// Adicionar evento de click às imagens da galeria
document.querySelectorAll('.galeria-img').forEach(img => {
    img.style.cursor = 'pointer';
    img.addEventListener('click', function() {
        const titulo = this.getAttribute('data-title');
        const origin = this.getAttribute('data-origin');
        const descricao = this.getAttribute('data-description');
        const src = this.getAttribute('src');
        
        abrirModalGaleria(titulo, origin, descricao, src);
    });
});
</script>

</body>
